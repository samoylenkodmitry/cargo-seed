[package]
name = "cargo-seed"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "New git worktrees start with a copy of the closest worktree's cargo target; unused build output is removed"
license = "MIT OR Apache-2.0"
repository = "https://github.com/samoylenkodmitry/cargo-seed"
readme = "README.md"
keywords = ["cargo", "worktree", "build", "cache", "subcommand"]
categories = ["development-tools::cargo-plugins"]

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
